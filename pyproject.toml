[project]
name = "finalproject-shaverov-m26-555"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Artem Shaverov", email = "studiwanov@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
]

[project.scripts]
project = "finalproject_shaverov_m26_555:main"
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
# Устанавливаем длину строки в соответствии с PEP8 (по умолчанию 88)
line-length = 88
# Указываем версию Python, под которую нужно проверять код
target-version = "py312" 
src = ["src"]

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""          